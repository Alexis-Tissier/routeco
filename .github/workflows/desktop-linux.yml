name: Desktop Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer le projet
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -e .

      - name: Construire Détour Linux
        run: bash scripts/build_desktop_linux.sh

      - name: Vérifier les artefacts
        run: |
          APPIMAGE="$(find dist/desktop -maxdepth 1 -name '*.AppImage' -print -quit)"
          ARCHIVE="$(find dist/desktop -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$APPIMAGE"
          test -n "$ARCHIVE"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract-and-run --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: detour-linux
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.tar.gz
          if-no-files-found: error

      - name: Publier dans la release du tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "Détour ${GITHUB_REF_NAME}" --prerelease --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/desktop/*.AppImage dist/desktop/*.tar.gz --clobber
